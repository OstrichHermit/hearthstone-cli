[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hearthstone-cli"
version = "0.2.0"
description = "Hearthstone toolbox for AI agents — deck building (validate, encode, filter, deck images, collection sync from game memory) and match analysis (board parsing from game logs, action replay, AI advisor watcher)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "OstrichHermit" }]
keywords = ["hearthstone", "deck", "deckstring", "cli", "agent", "card", "log-parser", "board"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
]

[project.urls]
Homepage = "https://github.com/OstrichHermit/hearthstone-cli"
Repository = "https://github.com/OstrichHermit/hearthstone-cli"
Issues = "https://github.com/OstrichHermit/hearthstone-cli/issues"

[project.scripts]
hs = "hearthstone_cli.deck:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
