[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hs-deck-cli"
version = "0.1.0"
description = "Hearthstone deck building CLI for AI agents — validate, encode/decode deckstrings, filter cards, deck library, share-ready deck images"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "OstrichHermit" }]
keywords = ["hearthstone", "deck", "deckstring", "cli", "agent", "card"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
]

[project.urls]
Homepage = "https://github.com/OstrichHermit/hs-deck-cli"
Repository = "https://github.com/OstrichHermit/hs-deck-cli"
Issues = "https://github.com/OstrichHermit/hs-deck-cli/issues"

[project.scripts]
hs = "hs_deck_cli.deck:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
